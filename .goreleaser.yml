version: 2
project_name: terraform-provider-contabo
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [zip]
    files:
      - README.md
      - LICENSE
      - PATCHES.md
      - CHANGELOG.md
checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
changelog:
  disable: true
# Releases go to the repository the workflow runs in.
release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  draft: false
  prerelease: auto
  header: |
    Unofficial distribution of the Contabo Terraform provider (`hayone1/contabo`).
    Not made by or connected to Contabo GmbH. See [CHANGELOG.md](https://github.com/hayone1/terraform-provider-contabo/blob/{{ .Tag }}/CHANGELOG.md) for the changes and [PATCHES.md](https://github.com/hayone1/terraform-provider-contabo/blob/{{ .Tag }}/PATCHES.md) for the carried patches.
